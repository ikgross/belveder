id: belvedere
title: Ломбард на последнем этаже

# Качества. scope run сбрасывается каждую ночь, profile живёт между ночами.
# Namespace `x.*` объявляет семейство качеств.
qualities:
  # hint — одна строка под HUD при первом изменении качества за всю игру.
  - id: turn
    scope: run
    label: Ход
    visible: true
    min: 0
    max: 16
    hint: "Каждое действие стоит времени. Ночь длится 16 ходов, с 22:00 до 06:00. На рассвете ты окажешься у Долли, где бы ни был."
  - id: suspicion
    scope: run
    label: Подозрение
    visible: true
    min: 0
    max: 10
    hint: "Грубые поступки дом запоминает. С 5 жильцы перестают открывать двери."
  - id: cigarettes
    scope: run
    label: Сигареты
    visible: true
    min: 0
    max: 5
    default: 3
    hint: "Сигареты здесь вместо мелочи: угостить, задобрить, откупиться. Каждую ночь у тебя снова три."
  - id: clues
    scope: run
    label: Улики
    visible: true
    min: 0
    hint: "Всё, что ты нашёл этой ночью. Некоторые находки помогут вернуть настоящее воспоминание при залоге."
  - { id: floor, scope: run, label: Этаж, min: 0, max: 13 }
  - { id: has.*, scope: run, label: Предметы и улики }
  - { id: seen.*, scope: run, label: Увидено этой ночью }
  # Должки по персонажу: debt.eddie, debt.sloan, debt.ruby…
  - { id: debt.*, scope: run, label: Должки, min: 0, max: 3 }
  - { id: night_pledged, scope: run, label: Ночь заложена, min: 0, max: 1 }
  # Ставит движок на залоге: что отдано и что вернулось ЭТОЙ ночью (для отчёта).
  - { id: pledged.*, scope: run, label: Заложено этой ночью, min: 0, max: 1 }
  - { id: returned.*, scope: run, label: Вернулось этой ночью, min: 0, max: 1 }
  - { id: returned_tonight, scope: run, label: Вернулось этой ночью, min: 0, max: 1 }
  # Ставит движок перед отчётом ночи, которая кончилась концовкой (фрагменты twist_final, price_final).
  - { id: ending_night, scope: run, label: Ночь концовки, min: 0, max: 1 }

  - { id: nights, scope: profile, label: Ночей, min: 0 }
  - id: dolly_trust
    scope: profile
    label: Доверие Долли
    visible: true
    min: 0
    max: 5
    hint: "Долли помнит все ночи, поэтому её доверие не сгорает. Чем оно выше, тем больше она тебе откроет."
  # Ложная биография Ника есть с самого начала (default 1); залог обнуляет флаг.
  - { id: mem.false.*, scope: profile, label: Жизнь Ника, default: 1, min: 0, max: 1 }
  - { id: mem.true.*, scope: profile, label: Жизнь Уолтера, min: 0, max: 1 }
  # Движок увеличивает на 1 при каждом возврате настоящего воспоминания.
  - id: memories_returned
    scope: profile
    label: Возвращено воспоминаний
    min: 0
    max: 8
    hint: "Вместо отданного вернулось настоящее воспоминание. Посмотри в блокноте, что ты теперь о себе знаешь."
  - { id: visited.*, scope: profile, label: Визиты дверей }
  # Первые встречи: открывают страницы блокнота и одноразовые карточки.
  - { id: met.*, scope: profile, label: Знакомства, min: 0, max: 1 }
  - { id: paths.*, scope: profile, label: Открытые пути }
  # Ставит движок: улика с run-флагом из evidence.yaml найдена хотя бы раз (папка улик).
  - { id: found.*, scope: profile, label: Улики в деле, min: 0, max: 1 }
  # Ставит движок на концовке; переживает «Новое дело» (эпилоги смотрят на прошлые прохождения).
  - { id: endings.*, scope: profile, label: Увиденные концовки, min: 0, max: 1 }

